services:
  redis:
    image: redis:7-alpine
    container_name: mata-kota-redis
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mata-kota-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mata-kota-redis-data:
