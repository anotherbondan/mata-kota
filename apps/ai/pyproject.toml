[project]
name = "mata-kota-ai"
version = "0.1.0"
description = "FastAPI AI service + STRSP (Space-Time Risk Score Predictor) for Matakota"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "scikit-learn>=1.6.0",
  "pyyaml>=6.0.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
  "xgboost>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*", "strsp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: gate yang membangun dataset penuh dari data riil (lebih lama)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
