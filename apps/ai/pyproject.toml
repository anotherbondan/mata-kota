[project]
name = "mata-kota-ai"
version = "0.1.0"
description = "FastAPI AI service scaffold for Matakota incident intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
ml = [
  "opencv-python>=4.11.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
